<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Alphabet Store</title>
    <link rel="stylesheet" href="css.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { gold: '#D4AF37', dark: '#121212', offwhite: '#FAFAFA' } } } }
    </script>
</head>
<body class="bg-offwhite min-h-screen font-sans text-dark flex flex-col">

    <header class="py-8 border-b border-gray-200 bg-white text-center relative">
        <a href="Cart.html" class="absolute left-6 top-1/2 transform -translate-y-1/2 text-sm text-gray-500 hover:text-dark flex items-center gap-2 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Return to Cart
        </a>
        <a href="index.html" class="text-3xl font-extrabold tracking-widest cursor-pointer hover:text-gray-700 transition">
            ALPHABET STORE
        </a>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12 w-full flex-grow">
        <div class="flex flex-col-reverse lg:flex-row gap-16">
            <div class="w-full lg:w-3/5">
                <section class="mb-10">
                    <h2 class="text-xl font-medium mb-4">Contact Information</h2>
                    <input type="email" placeholder="Email address" class="w-full p-4 border border-gray-300 bg-white focus:outline-none focus:border-dark transition mb-4">
                </section>

                <section class="mb-10">
                    <h2 class="text-xl font-medium mb-4">Shipping Address</h2>
                    <input type="text" placeholder="Address" class="w-full p-4 border border-gray-300 bg-white focus:outline-none focus:border-dark transition mb-4">
                </section>

                <section class="mb-10">
                    <h2 class="text-xl font-medium mb-4">Payment</h2>
                    <div class="border border-gray-300 bg-white p-6">
                        <input type="text" placeholder="Card number" class="w-full p-4 border border-gray-300 bg-white focus:outline-none focus:border-dark transition mb-4">
                    </div>
                </section>

                <a href="Thank_you.html" class="w-full bg-dark text-white py-5 uppercase tracking-widest font-medium hover:bg-gray-800 transition duration-300 text-lg flex justify-center items-center gap-3 block text-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Pay ₹2,398
                </a>
            </div>

            <div class="w-full lg:w-2/5">
                <div class="bg-white p-8 border border-gray-200 sticky top-10">
                    <h2 class="text-lg font-medium tracking-widest uppercase mb-6 border-b border-gray-200 pb-4">Order Summary</h2>
                    <div class="flex justify-between items-end text-xl font-semibold border-t border-gray-200 pt-6 mt-6">
                        <span>Total</span>
                        <span>₹2,398</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="bg-white py-8 border-t border-gray-200 text-center mt-auto">
        <p class="text-xs text-gray-500">Secure Encrypted Checkout</p>
    </footer>
</body>
</html>
