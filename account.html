    Free Shipping over <span class="font-bold text-gold">₹999</span> &nbsp;|&nbsp; Easy 7-Day Returns
  </aside>

  <header class="sticky top-0 z-40 w-full bg-offwhite/95 backdrop-blur-md border-b border-gray-200 shadow-sm">
    <nav class="max-w-7xl mx-auto flex justify-between items-center px-4 sm:px-6 lg:px-8 h-20" aria-label="Main navigation">

    </nav>

  <main class="flex-grow flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md">

      <!-- LOGGED OUT: Auth card -->
      <div id="auth-card" class="bg-white border border-gray-200 shadow-sm p-8">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-serif font-light text-dark mb-2" id="auth-title">Welcome Back</h1>
          <p class="text-gray-500 text-sm" id="auth-sub">Login to your Alphabet Store account</p>
        </div>

        <!-- Google Sign-In -->
        <button id="google-btn" onclick="googleSignIn()" class="w-full flex items-center justify-center gap-3 border border-gray-300 py-3.5 text-sm font-semibold text-dark hover:bg-gray-50 transition-colors mb-5">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>
          Continue with Google
        </button>
        <div class="flex items-center gap-3 mb-5">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-xs text-gray-400 uppercase tracking-widest">or</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <!-- Tabs -->
        <div class="flex border border-gray-200 mb-6">
          <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 text-xs uppercase tracking-widest font-bold bg-dark text-white transition">Login</button>
          <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2.5 text-xs uppercase tracking-widest font-bold bg-white text-dark transition">Register</button>
        </div>

        <div id="auth-msg" class="hidden text-sm p-3 mb-4 text-center"></div>

        <!-- Name (register only) -->
        <div id="name-field" class="mb-4 hidden">
          <label class="block text-xs uppercase tracking-widest text-gray-500 font-bold mb-2">Full Name</label>
          <input type="text" id="name" placeholder="Your name" autocomplete="name" class="w-full border border-gray-300 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
        </div>

        <div class="mb-4">
          <label class="block text-xs uppercase tracking-widest text-gray-500 font-bold mb-2">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" class="w-full border border-gray-300 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
        </div>

        <div class="mb-6">
          <label class="block text-xs uppercase tracking-widest text-gray-500 font-bold mb-2">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" class="w-full border border-gray-300 px-4 py-3 text-sm outline-none focus:border-gold transition-colors">
          <p id="reset-link" class="text-xs text-gray-400 mt-2 text-right hidden"><button onclick="resetPassword()" class="hover:text-gold underline">Forgot password?</button></p>
        </div>

        <button id="auth-submit" onclick="submitAuth()" class="w-full bg-dark text-white py-4 uppercase tracking-widest text-sm font-bold hover:bg-gold hover:text-dark transition-colors duration-300">Login</button>

        <p class="text-xs text-gray-400 text-center mt-6">By continuing you agree to our <a href="privacy-policy.html" class="underline hover:text-gold">Privacy Policy</a>.</p>
      </div>

      <!-- LOGGED IN: Account dashboard -->
      <div id="account-card" class="bg-white border border-gray-200 shadow-sm p-8 hidden">
        <div class="text-center mb-8">
          <div class="w-20 h-20 rounded-full bg-gold/20 flex items-center justify-center text-2xl font-bold text-dark mx-auto mb-4" id="acct-avatar">A</div>
          <h1 class="text-2xl font-serif font-light text-dark mb-1" id="acct-name">Welcome</h1>
          <p class="text-gray-500 text-sm" id="acct-email"></p>
        </div>
        <div class="space-y-3">
          <a href="track-order.html" class="block w-full border border-gray-300 py-3 text-center text-sm uppercase tracking-widest font-semibold hover:border-gold hover:text-gold transition">Track My Orders</a>
          <a href="catalogue.html" class="block w-full border border-gray-300 py-3 text-center text-sm uppercase tracking-widest font-semibold hover:border-gold hover:text-gold transition">Continue Shopping</a>
          <button onclick="doLogout()" class="block w-full bg-dark text-white py-3 text-center text-sm uppercase tracking-widest font-bold hover:bg-red-700 transition">Logout</button>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-dark text-gray-400 py-10 px-6 text-center text-sm">
    <p class="mb-2"><a href="index.html" class="text-white font-bold tracking-widest">ALPHABET</a></p>
    <p class="text-xs">© 2026 Alphabet Store · Mumbai, India 🇮🇳</p>
  </footer>

  <script src="products.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
             signOut, onAuthStateChanged, updateProfile, sendPasswordResetEmail,
             GoogleAuthProvider, signInWithPopup }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const app = initializeApp({
      apiKey: "AIzaSyA8kP9mASgrog-_Rbuldrnm4rRJm1LmaSU",
      authDomain: "alphabet-stores.firebaseapp.com",
      projectId: "alphabet-stores",
      storageBucket: "alphabet-stores.firebasestorage.app",
      messagingSenderId: "1068812719722",
      appId: "1:1068812719722:web:9db5e8c634487dce121c13"
    });
    const auth = getAuth(app);

    let mode = 'login';

    window.switchTab = function(m) {
      mode = m;
      const isLogin = m === 'login';
      document.getElementById('tab-login').className = `flex-1 py-2.5 text-xs uppercase tracking-widest font-bold transition ${isLogin?'bg-dark text-white':'bg-white text-dark'}`;
      document.getElementById('tab-register').className = `flex-1 py-2.5 text-xs uppercase tracking-widest font-bold transition ${!isLogin?'bg-dark text-white':'bg-white text-dark'}`;
      document.getElementById('name-field').classList.toggle('hidden', isLogin);
      document.getElementById('reset-link').classList.toggle('hidden', !isLogin);
      document.getElementById('auth-title').textContent = isLogin ? 'Welcome Back' : 'Create Account';
      document.getElementById('auth-sub').textContent = isLogin ? 'Login to your Alphabet Store account' : 'Join Alphabet Store today';
      document.getElementById('auth-submit').textContent = isLogin ? 'Login' : 'Create Account';
      hideMsg();
    };

    function showMsg(text, ok) {
      const m = document.getElementById('auth-msg');
      m.textContent = text;
      m.className = `text-sm p-3 mb-4 text-center ${ok?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-600 border border-red-200'}`;
      m.classList.remove('hidden');
    }
    function hideMsg(){ document.getElementById('auth-msg').classList.add('hidden'); }

    function friendlyError(code) {
      const map = {
        'auth/invalid-email':'Please enter a valid email address.',
        'auth/user-not-found':'No account found with this email. Try registering.',
        'auth/wrong-password':'Incorrect password. Try again or reset it.',
        'auth/invalid-credential':'Email or password is incorrect.',
        'auth/email-already-in-use':'This email is already registered. Try logging in.',
        'auth/weak-password':'Password should be at least 6 characters.',
        'auth/too-many-requests':'Too many attempts. Please wait a moment and try again.',
        'auth/network-request-failed':'Network error. Check your connection.'
      };
      return map[code] || 'Something went wrong. Please try again.';
    }

    window.submitAuth = async function() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value.trim();
      const btn = document.getElementById('auth-submit');
      if (!email || !password) { showMsg('Please fill in email and password.', false); return; }
      if (mode === 'register' && !name) { showMsg('Please enter your name.', false); return; }
      btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Please wait…';
      try {
        if (mode === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          if (name) await updateProfile(cred.user, { displayName: name });
        }
        // onAuthStateChanged will swap the UI
      } catch (e) {
        showMsg(friendlyError(e.code), false);
        btn.disabled = false; btn.textContent = orig;
      }
    };

    window.doLogout = async function() {
      await signOut(auth);
    };

    window.googleSignIn = async function() {
      const provider = new GoogleAuthProvider();
      const btn = document.getElementById('google-btn');
      btn.disabled = true;
      try {
        await signInWithPopup(auth, provider);
        // onAuthStateChanged swaps the UI
      } catch (e) {
        let msg = 'Google sign-in failed. Please try again.';
        if (e.code === 'auth/popup-closed-by-user') msg = 'Sign-in cancelled.';
        else if (e.code === 'auth/unauthorized-domain') msg = 'This domain is not authorized in Firebase yet.';
        else if (e.code === 'auth/popup-blocked') msg = 'Popup blocked — please allow popups and retry.';
        showMsg(msg, false);
        btn.disabled = false;
      }
    };

    window.resetPassword = async function() {
      const email = document.getElementById('email').value.trim();
      if (!email) { showMsg('Enter your email above first, then click reset.', false); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        showMsg('Password reset email sent! Check your inbox.', true);
      } catch (e) { showMsg(friendlyError(e.code), false); }
    };

    onAuthStateChanged(auth, (user) => {
      const authCard = document.getElementById('auth-card');
      const acctCard = document.getElementById('account-card');
      if (user) {
        authCard.classList.add('hidden');
        acctCard.classList.remove('hidden');
        const display = user.displayName || user.email.split('@')[0];
        document.getElementById('acct-name').textContent = 'Hi, ' + display;
        document.getElementById('acct-email').textContent = user.email;
        document.getElementById('acct-avatar').textContent = (display[0] || 'A').toUpperCase();
      } else {
        authCard.classList.remove('hidden');
        acctCard.classList.add('hidden');
        const btn = document.getElementById('auth-submit');
        btn.disabled = false;
        const gbtn = document.getElementById('google-btn');
        if (gbtn) gbtn.disabled = false;
      }
    });

    switchTab('login');
  </script>
  <script>if (typeof updateCartBadge === 'function') updateCartBadge();</script>
