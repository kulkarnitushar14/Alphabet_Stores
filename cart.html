<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Alphabet Store</title>
    <link rel="stylesheet" href="css.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { gold: '#D4AF37', dark: '#121212', offwhite: '#FAFAFA' } } } }
    </script>
</head>
<body class="bg-offwhite min-h-screen font-sans text-dark flex flex-col">

    <nav class="flex justify-between items-center p-6 border-b border-gray-300 bg-white">
        <div class="space-x-6 text-sm uppercase tracking-wide hidden md:block">
            <a href="index.html" class="hover:text-gold transition duration-300">Home</a>
            <a href="catalogue.html" class="hover:text-gold transition duration-300">Shop</a>
            <a href="about_us.html" class="hover:text-gold transition duration-300">About</a>
        </div>
        <a href="index.html" class="text-3xl font-extrabold tracking-widest text-center flex-1 cursor-pointer hover:text-gray-700 transition">
            ALPHABET STORE
        </a>
        <div class="space-x-6 text-sm uppercase tracking-wide flex">
            <a href="#" class="hover:text-gold transition duration-300">Search</a>
            <a href="Cart.html" class="text-gold transition duration-300">Cart (2)</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-16 w-full flex-grow">
        <h1 class="text-3xl font-light tracking-widest uppercase mb-12 border-b border-gray-300 pb-4">Your Bag</h1>

        <div class="flex flex-col lg:flex-row gap-16">
            <div class="w-full lg:w-2/3">
                <div class="flex gap-6 py-6 border-b border-gray-200">
                    <div class="w-24 h-32 bg-gray-200 flex-shrink-0 border border-gray-300"></div>
                    <div class="flex flex-col justify-between flex-grow">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-lg font-medium">Gold Plated Chain</h3>
                                <p class="text-gray-500 text-sm mt-1">Variant: 18k Gold</p>
                            </div>
                            <span class="font-semibold text-lg">₹1,499</span>
                        </div>
                        <div class="flex justify-between items-center mt-4">
                            <div class="flex items-center border border-gray-300">
                                <button class="px-3 py-1 hover:bg-gray-100 transition">-</button>
                                <span class="px-4 py-1 text-sm border-l border-r border-gray-300">1</span>
                                <button class="px-3 py-1 hover:bg-gray-100 transition">+</button>
                            </div>
                            <button class="text-sm text-gray-400 hover:text-dark underline uppercase tracking-wider transition">Remove</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-1/3">
                <div class="bg-white p-8 border border-gray-200 sticky top-10">
                    <h2 class="text-xl font-medium tracking-widest uppercase mb-6">Order Summary</h2>
                    <div class="flex justify-between text-gray-600 mb-4 text-sm">
                        <span>Subtotal</span><span>₹2,398</span>
                    </div>
                    <div class="flex justify-between text-gray-600 mb-6 text-sm pb-6 border-b border-gray-200">
                        <span>Shipping</span><span class="text-green-700 tracking-wide uppercase text-xs font-semibold mt-1">Free</span>
                    </div>
                    <div class="flex justify-between items-end mb-8 text-lg font-semibold">
                        <span>Total</span><span>₹2,398</span>
                    </div>

                    <a href="payment.html" class="block text-center w-full bg-dark text-white py-4 uppercase tracking-widest text-sm hover:bg-gray-800 transition duration-300 mb-4">
                        Secure Checkout
                    </a>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="bg-dark text-white py-12 px-6 text-center mt-auto">
        <p class="text-gray-500 text-xs tracking-wider">© 2026 ALPHABET STORE. ALL RIGHTS RESERVED.</p>
    </footer>
</body>
</html>
