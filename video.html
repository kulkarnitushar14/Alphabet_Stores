    .vid-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

    .vid-play { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    /* Lightbox */
    .vid-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
    .vid-modal.open { display: flex; }
    .vid-modal video { max-height: 86vh; max-width: 480px; width: 100%; border-radius: 8px; background:#000; }

      { src: B+'ForBiggerBlazes.mp4',     title: 'LED Hand Fan — Demo',    price: '₹289', pid: 1 },
      { src: B+'ForBiggerEscapes.mp4',    title: 'Frother — How To',       price: '₹278', pid: 2 },
      { src: B+'ForBiggerFun.mp4',        title: 'Oil Sprayer — Review',   price: '₹249', pid: 3 },
      { src: B+'ForBiggerJoyrides.mp4',   title: 'Dispenser — In Use',     price: '₹289', pid: 4 },
      { src: B+'ForBiggerMeltdowns.mp4',  title: 'Straws — Unboxing',      price: '₹129', pid: 9 },
      { src: B+'ElephantsDream.mp4',      title: 'Storage — Setup',        price: '₹249', pid: 8 },
      { src: B+'Sintel.mp4',              title: 'Wall Hooks — Install',   price: '₹178', pid: 6 },
      { src: B+'TearsOfSteel.mp4',        title: 'Book Film — Demo',       price: '₹249', pid: 5 },
      { src: B+'ForBiggerBlazes.mp4',     title: 'Fan — Customer Clip',    price: '₹289', pid: 1 },
      { src: B+'ForBiggerFun.mp4',        title: 'Sprayer — Tips',         price: '₹249', pid: 3 },
      { src: B+'ForBiggerEscapes.mp4',    title: 'Frother — Latte Art',    price: '₹278', pid: 2 },
      { src: B+'ForBiggerMeltdowns.mp4',  title: 'Straws — Cleaning',      price: '₹129', pid: 9 }
    ];

    const grid = document.getElementById('video-grid');
    VIDEOS.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'vid-card';
      card.onclick = () => openVideo(v);
      card.innerHTML = `
        <video src="${v.src}#t=0.1" muted loop playsinline preload="metadata"></video>
        <span class="vid-play"><svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
        <div class="vid-info"><div class="vid-title">${v.title}</div><div class="vid-price">${v.price}</div></div>`;
      const vid = card.querySelector('video');
      card.addEventListener('mouseenter', () => vid.play().catch(()=>{}));
      card.addEventListener('mouseleave', () => vid.pause());
      grid.appendChild(card);
    });

    const modal = document.getElementById('vid-modal');
    const modalVideo = document.getElementById('modal-video');
    const modalShop = document.getElementById('modal-shop');
    function openVideo(v) {
      modalVideo.src = v.src;
      modalShop.href = 'product.html?id=' + v.pid;
      modal.classList.add('open');
      modalVideo.play().catch(()=>{});
      document.body.style.overflow = 'hidden';
    }
    function closeVideo() {
      modal.classList.remove('open');
      modalVideo.pause();
      modalVideo.src = '';
      document.body.style.overflow = '';
    }
    modal.addEventListener('click', (e) => { if (e.target === modal) closeVideo(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVideo(); });
    window.closeVideo = closeVideo;

    // cart badge
    if (typeof updateCartBadge === 'function') updateCartBadge();
  </script>
