<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Alphabet Store</title>
  <link rel="stylesheet" href="css.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { gold: '#D4AF37', dark: '#121212', offwhite: '#FAFAFA', grayLight: '#F3F4F6' }, fontFamily: { sans: ['Inter','sans-serif'], serif: ['Merriweather','serif'] } } } }</script>
</head>
<body class="bg-offwhite min-h-screen font-sans text-dark antialiased flex flex-col">

  <aside class="bg-dark text-offwhite text-xs text-center py-2.5 tracking-[0.2em] uppercase font-medium">
    Free Shipping over <span class="font-bold text-gold">₹999</span> &nbsp;|&nbsp; 7-Day Easy Returns
  </aside>

  <header class="sticky top-0 z-40 w-full bg-offwhite/95 backdrop-blur-md border-b border-gray-200 shadow-sm">
    <nav class="max-w-7xl mx-auto flex justify-between items-center px-4 sm:px-6 lg:px-8 h-20">
      <div class="hidden md:flex flex-1 space-x-8 text-sm uppercase tracking-widest font-semibold text-gray-600">
        <a href="index.html" class="hover:text-gold transition-colors">Home</a>
        <a href="catalogue.html" class="hover:text-gold transition-colors">Shop</a>
        <a href="about_us.html" class="hover:text-gold transition-colors">About</a>
      </div>
      <div class="flex-shrink-0 text-center flex-1 md:flex-none">
        <a href="index.html" class="text-2xl md:text-3xl font-extrabold tracking-[0.25em] text-dark hover:text-gray-700 transition-colors flex items-center justify-center gap-2">
          <svg class="w-7 h-7 hidden sm:block" viewBox="0 0 40 40" fill="none"><path d="M20 0L40 20L20 40L0 20L20 0Z" fill="#121212"/><path d="M20 10L30 20L20 30L10 20L20 10Z" fill="#FAFAFA"/><path d="M20 16L24 20L20 24L16 20L20 16Z" fill="#D4AF37"/></svg>
          ALPHABET
        </a>
      </div>
      <div class="flex flex-1 justify-end items-center gap-4">
        <a href="cart.html" class="hover:text-gold transition-colors flex items-center relative p-2">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>
          <span id="nav-cart-count" class="absolute top-0 right-0 inline-flex items-center justify-center px-1.5 py-0.5 text-[10px] font-bold leading-none text-white bg-gold rounded-full">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full" id="product-main">
    <!-- Breadcrumb -->
    <nav class="text-xs text-gray-400 uppercase tracking-widest mb-10 flex items-center gap-2">
      <a href="index.html" class="hover:text-gold transition-colors">Home</a>
      <span>/</span>
      <a href="catalogue.html" class="hover:text-gold transition-colors">Shop</a>
      <span>/</span>
      <span id="breadcrumb-name" class="text-dark">Product</span>
    </nav>

    <div class="flex flex-col lg:flex-row gap-14 lg:gap-20">
      <!-- IMAGE -->
      <div class="w-full lg:w-1/2">
        <div id="product-image" class="bg-gray-100 aspect-square w-full flex items-center justify-center border border-gray-200 text-9xl">🛒</div>
        <!-- Thumbnails placeholder -->
        <div class="grid grid-cols-4 gap-3 mt-3">
          <div class="bg-gray-100 aspect-square border border-gray-200 flex items-center justify-center text-2xl" id="thumb-1">—</div>
          <div class="bg-gray-100 aspect-square border border-gray-200 flex items-center justify-center text-2xl" id="thumb-2">—</div>
          <div class="bg-gray-100 aspect-square border border-gray-200 flex items-center justify-center text-2xl" id="thumb-3">—</div>
          <div class="bg-gray-100 aspect-square border border-gray-200 flex items-center justify-center text-2xl" id="thumb-4">—</div>
        </div>
      </div>

      <!-- DETAILS -->
      <div class="w-full lg:w-1/2 flex flex-col">
        <p id="product-cat" class="text-xs uppercase tracking-widest text-gold font-semibold mb-3"></p>
        <h1 id="product-name" class="text-3xl font-serif font-light tracking-wide text-dark mb-2 leading-snug"></h1>
        <p id="product-subtitle" class="text-gray-500 text-sm mb-5 font-light"></p>

        <!-- Stars -->
        <div class="flex items-center gap-2 mb-6">
          <div class="flex text-gold">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
          </div>
          <span id="review-count" class="text-sm text-gray-500"></span>
        </div>

        <!-- Price -->
        <div class="flex items-end gap-4 mb-8 pb-8 border-b border-gray-200">
          <span id="product-price" class="text-4xl font-light text-dark"></span>
          <div class="flex flex-col">
            <span id="product-mrp" class="text-gray-400 text-sm line-through"></span>
            <span id="product-off" class="text-green-700 text-sm font-semibold"></span>
          </div>
        </div>

        <!-- Description -->
        <p id="product-desc" class="text-gray-600 leading-relaxed text-sm font-light mb-8"></p>

        <!-- Features -->
        <div id="product-features" class="mb-8 grid grid-cols-2 gap-2"></div>

        <!-- Quantity + Add to Cart -->
        <div class="flex items-center gap-4 mb-6">
          <div class="flex items-center border border-gray-300 h-12 w-32">
            <button id="qty-minus" class="w-10 h-full hover:bg-gray-100 text-gray-600 transition text-xl leading-none">−</button>
            <input id="qty-input" type="number" value="1" min="1" max="20" class="w-12 h-full border-x border-gray-300 focus:outline-none bg-transparent text-center font-medium">
            <button id="qty-plus" class="w-10 h-full hover:bg-gray-100 text-gray-600 transition text-xl leading-none">+</button>
          </div>
          <button id="add-to-cart-btn" class="flex-1 bg-dark text-white py-4 uppercase tracking-widest text-sm font-bold hover:bg-gold transition-colors duration-300 shadow-md hover:shadow-none">
            Add to Cart
          </button>
        </div>
        <a href="cart.html" id="buy-now-btn" class="block text-center border border-dark text-dark py-4 uppercase tracking-widest text-sm font-bold hover:bg-dark hover:text-white transition-colors duration-300 mb-8">
          Buy Now
        </a>

        <!-- Trust signals -->
        <div class="space-y-3 pt-6 border-t border-gray-200">
          <div class="flex items-center gap-3 text-gray-500 text-sm">
            <svg class="w-5 h-5 text-dark shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            Inclusive of all taxes · Free delivery
          </div>
          <div class="flex items-center gap-3 text-gray-500 text-sm">
            <svg class="w-5 h-5 text-dark shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            10-Day Replacement Guarantee
          </div>
          <div class="flex items-center gap-3 text-gray-500 text-sm">
            <svg class="w-5 h-5 text-dark shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            Secure 256-bit SSL · Sold by Alphabet Store
          </div>
        </div>
      </div>
    </div>

    <!-- RELATED PRODUCTS -->
    <section class="mt-20 pt-12 border-t border-gray-200">
      <h2 class="text-2xl font-serif font-light tracking-wide text-dark mb-10">You May Also Like</h2>
      <div id="related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
    </section>

  </main>

  <footer class="bg-dark text-gray-400 py-8 px-6 text-center border-t border-gray-800 mt-auto">
    <p class="text-xs tracking-wider">© 2026 ALPHABET STORE. ALL RIGHTS RESERVED.</p>
  </footer>

  <script src="products.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const pid = parseInt(params.get('id')) || 1;
    const product = PRODUCTS.find(p => p.id === pid) || PRODUCTS[0];
    const off = Math.round((1 - product.price / product.mrp) * 100);

    document.title = product.name + ' | Alphabet Store';
    document.getElementById('breadcrumb-name').textContent = product.name;
    document.getElementById('product-image').textContent = product.emoji;
    document.getElementById('product-cat').textContent = product.cat;
    document.getElementById('product-name').textContent = product.name;
    document.getElementById('product-subtitle').textContent = product.subtitle;
    document.getElementById('product-price').textContent = '₹' + product.price;
    document.getElementById('product-mrp').textContent = 'M.R.P: ₹' + product.mrp;
    document.getElementById('product-off').textContent = '-' + off + '% (' + off + '% off)';
    document.getElementById('product-desc').textContent = product.desc;
    document.getElementById('review-count').textContent = `5.0 ★ · ${product.reviews} rating${product.reviews !== 1 ? 's' : ''}`;

    // Thumbnails
    ['thumb-1','thumb-2','thumb-3','thumb-4'].forEach(id => {
      document.getElementById(id).textContent = product.emoji;
    });

    // Features
    const featureEl = document.getElementById('product-features');
    featureEl.innerHTML = product.features.map(f => `
      <div class="flex items-center gap-2 text-sm text-gray-600 font-light">
        <svg class="w-4 h-4 text-gold shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        ${f}
      </div>`).join('');

    // Qty
    let qty = 1;
    document.getElementById('qty-minus').addEventListener('click', () => { if(qty>1){qty--;document.getElementById('qty-input').value=qty;} });
    document.getElementById('qty-plus').addEventListener('click', () => { if(qty<20){qty++;document.getElementById('qty-input').value=qty;} });
    document.getElementById('qty-input').addEventListener('input', e => { qty = Math.max(1, Math.min(20, parseInt(e.target.value)||1)); e.target.value = qty; });

    document.getElementById('add-to-cart-btn').addEventListener('click', () => { addToCart(product.id, qty); });
    document.getElementById('buy-now-btn').addEventListener('click', () => { addToCart(product.id, qty); });

    // Related
    const related = PRODUCTS.filter(p => p.id !== product.id).slice(0, 4);
    const rGrid = document.getElementById('related-grid');
    const star = `<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
    rGrid.innerHTML = related.map(p => {
      const o = Math.round((1-p.price/p.mrp)*100);
      return `<a href="product.html?id=${p.id}" class="group block">
        <div class="bg-gray-100 aspect-square flex items-center justify-center text-5xl mb-3 border border-transparent group-hover:border-gray-300 transition-colors overflow-hidden">${p.emoji}</div>
        <p class="text-sm font-medium group-hover:text-gold transition-colors">${p.name}</p>
        <div class="flex items-center gap-1 text-gold text-xs mt-1">${star.repeat(5)}</div>
        <div class="flex items-center gap-2 mt-1">
          <span class="font-semibold text-sm">₹${p.price}</span>
          <span class="text-gray-400 text-xs line-through">₹${p.mrp}</span>
          <span class="text-green-700 text-xs">${o}% off</span>
        </div>
      </a>`;
    }).join('');

    updateCartBadge();
  </script>
</body>
</html>
