<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Alphabet Store</title>
    <link rel="stylesheet" href="css.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { gold: '#D4AF37', dark: '#121212', offwhite: '#FAFAFA' } } } }
    </script>
</head>
<body class="bg-offwhite min-h-screen font-sans text-dark flex flex-col items-center">

    <header class="py-8 w-full border-b border-gray-200 bg-white text-center">
        <a href="index.html" class="text-3xl font-extrabold tracking-widest cursor-pointer hover:text-gray-700 transition">
            ALPHABET STORE
        </a>
    </header>

    <main class="max-w-3xl w-full px-6 py-16 flex-grow flex flex-col items-center">
        <div class="w-16 h-16 rounded-full border border-dark flex items-center justify-center mb-8">
            <svg class="w-8 h-8 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"></path></svg>
        </div>

        <h1 class="text-3xl font-light tracking-widest uppercase mb-2 text-center">Thank You</h1>
        <p class="text-gray-500 mb-10 text-center">Your order has been successfully placed.</p>

        <a href="catalogue.html" class="border border-dark bg-dark text-white px-12 py-4 uppercase tracking-widest text-sm hover:bg-white hover:text-dark transition duration-300">
            Continue Shopping
        </a>
    </main>
</body>
</html>
